name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/roemerplant.keystore

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/roemerplant.keystore
        run: gradle assembleRelease --stacktrace && cp app/build/outputs/apk/release/app-release.apk RoemerPlant-${{ github.ref_name }}.apk

      - name: Build debug APK (fallback without signing secrets)
        if: env.HAS_KEYSTORE != 'true'
        run: gradle assembleDebug --stacktrace && cp app/build/outputs/apk/debug/app-debug.apk RoemerPlant-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RoemerPlant-${{ github.ref_name }}.apk
          generate_release_notes: true
